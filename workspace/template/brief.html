<script>/* ---- 锁定竞品 ---- */
(function () {
const A = window.ATLAS;
const fmt = AtlasUI.fmt;
const POOL = A.pool;
const PICKED = POOL.filter((b) => b.picked).sort((a, b) => b.relevance + b.heat - a.relevance - a.heat);
const P = A.product.pool;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CUT = A.product.cut;
const CORE = POOL.filter((b) => b.relevance >= CUT.relevance && b.heat >= CUT.heat);
const short = (n) => (n.length > 9 && n.includes(' · ') ? n.split(' · ')[0] : n);

function head(title) {
  return `<header class="p1-head">
    <p class="eyebrow">锁定竞品</p>
    <h2>${title}</h2>
    <p class="p1-src">池子：${P.source} · 素材库 ${P.library.toLocaleString('zh-CN')} 条 → ${P.brands} 组候选 / ${P.notes} 条笔记 · ${P.window}<br>${A.product.dataNote}</p>
    <dl class="p1-defs">
      <div><dt>相关性</dt><dd>判断分 = 0.3 × 人群重合 + 0.4 × 动机重合 + 0.3 × 动作重合（和${AtlasUI.nm(A.product.name)}比）</dd></div>
      <div><dt>爆品度</dt><dd>榜单数据算出 = 0.5 × 榜内百分位中位数 + 0.3 × 爆款占比（≥ 80 百分位）+ 0.2 × 素材量</dd></div>
    </dl>
  </header>`;
}

function pickCards(delayBase = 0) {
  return `<div class="p1-picks">${PICKED.map((b, i) => `
    <article class="p1-pick p1-enter" style="--d:${delayBase + i * 50}ms">
      <div class="p1-pick-top"><span class="p1-pick-rank">${i + 1}</span><span class="p1-pick-name">${b.name}</span><span class="p1-kind">${b.kind}竞品</span></div>
      <div class="p1-pick-metrics">相关性 ${b.relevance} · 爆品度 ${b.heat} · ${b.notes} 条笔记 · ${b.accounts} 个账号</div>
      <p class="p1-pick-why">${b.why}</p>
      <a class="p1-pick-link" href="#hits" data-go="hits" data-c="${b.id}">看爆款 <span aria-hidden="true">→</span></a>
    </article>`).join('')}</div>`;
}

function dataTable() {
  const rows = [...POOL].sort((a, b) => b.relevance - a.relevance);
  return `<details class="p1-details"><summary>查看数据表（${POOL.length} 组候选）</summary>
    <div class="p1-table-wrap"><table class="p1-table">
      <thead><tr><th scope="col">候选</th><th scope="col">类型</th><th scope="col">人群</th><th scope="col">动机</th><th scope="col">动作</th><th scope="col">相关性</th><th scope="col">百分位中位数</th><th scope="col">爆款占比</th><th scope="col">笔记</th><th scope="col">账号</th><th scope="col">爆品度</th></tr></thead>
      <tbody>${rows.map((b) => `<tr ${b.picked ? 'data-picked' : ''}><td>${b.name}</td><td>${b.kind}</td><td>${b.user}</td><td>${b.motive}</td><td>${b.action}</td><td>${b.relevance}</td><td>${b.medianPct}</td><td>${b.hitShare}%</td><td>${b.notes}</td><td>${b.accounts}</td><td>${b.heat}</td></tr>`).join('')}</tbody>
    </table></div></details>`;
}

/* tooltip: content built with textContent (labels are data) */
function makeTip(stage) {
  const tip = document.createElement('div');
  tip.className = 'p1-tip';
  tip.setAttribute('role', 'tooltip');
  stage.append(tip);
  let pinned = null;
  function fill(b) {
    tip.replaceChildren();
    const t = document.createElement('b'); t.textContent = b.name; tip.append(t);
    const k = document.createElement('div'); k.textContent = `${b.kind}竞品${b.picked ? ' · 已入选' : ''}`; k.style.color = 'var(--ink-3)'; tip.append(k);
    const rows = [['相关性', b.relevance, ''], ['· 人群 / 动机 / 动作', `${b.user} / ${b.motive} / ${b.action}`, ''], ['爆品度', b.heat, ''], ['· 百分位中位数', b.medianPct, ''], ['· 爆款占比', b.hitShare + '%', ''], ['· 笔记 / 账号', `${b.notes} / ${b.accounts}`, '']];
    for (const [l, v, s] of rows) {
      const r = document.createElement('div'); r.className = 'row';
      const a = document.createElement('span'); a.textContent = s ? `${l}（${s}）` : l;
      const c = document.createElement('strong'); c.textContent = v;
      r.append(a, c); tip.append(r);
    }
    const w = document.createElement('div'); w.className = 'why'; w.textContent = b.why; tip.append(w);
    if (pinned && b.picked) {
      const g = document.createElement('a'); g.className = 'tip-go'; g.href = '#hits'; g.dataset.go = 'hits'; g.dataset.c = b.id; g.textContent = '看爆款 →'; tip.append(g);
    }
    if (!pinned) { const h = document.createElement('div'); h.className = 'tip-hint'; h.textContent = '点一下固定'; tip.append(h); }
  }
  return {
    get pinned() { return pinned; },
    pin(b, x, y) { pinned = b; tip.setAttribute('data-pinned', ''); this.place(b, x, y); tip.querySelector('.tip-go')?.focus({ preventScroll: true }); },
    unpin() { pinned = null; tip.removeAttribute('data-pinned'); this.hide(true); },
    show(b, x, y) { if (!pinned) this.place(b, x, y); },
    place(b, x, y) {
      fill(b);
      tip.setAttribute('data-on', '');
      const r = tip.getBoundingClientRect();
      let left = x + 14, top = y + 14;
      if (left + r.width > innerWidth - 12) left = x - r.width - 14;
      if (left < 12) left = 12;
      if (top + r.height > innerHeight - 12) top = y - r.height - 14;
      tip.style.left = left + 'px'; tip.style.top = top + 'px';
    },
    hide(force) { if (!pinned || force) tip.removeAttribute('data-on'); },
    el: tip,
  };
}

function verdict() {
  const names = (L) => L.map((b) => `<strong>${b.name}</strong>`).join('、');
  let t = `分界线取相关性 <strong class="num">${CUT.relevance}</strong> / 爆品度 <strong class="num">${CUT.heat}</strong>。右上「核心对标」区 ${CORE.length} 组`;
  const dropped = CORE.filter((b) => !b.picked), added = PICKED.filter((b) => !CORE.includes(b));
  if (!dropped.length && !added.length) t += `，正好是 ${names(PICKED)}，全部入选。`;
  else t += `，${dropped.length ? `人工复核去掉 ${names(dropped)}` : ''}${added.length ? `${dropped.length ? '，' : ''}补入 ${names(added)}` : ''}，留下 ${PICKED.length} 个。`;
  const near = POOL.filter((b) => !CORE.includes(b) && (b.relevance >= CUT.relevance || b.heat >= CUT.heat))
    .sort((a, b) => Math.min(b.relevance - CUT.relevance, b.heat - CUT.heat) - Math.min(a.relevance - CUT.relevance, a.heat - CUT.heat))[0];
  if (near) t += `最接近的是 <strong>${near.name}</strong>（${near.relevance} / ${near.heat}，差在${near.relevance < CUT.relevance ? '相关性' : '爆品度'}）。`;
  return t;
}

function v1Summary() {
  const S = window.ATLAS.product.selection;
  const nm = (n) => n.replace(/（.*?）/g, '').split(' / ')[0];
  return AtlasUI.summary([
    { k: '池子', v: S.pool },
    { k: '怎么筛', v: S.rule },
    { k: '结果', v: `<b>入选 ${S.picked.length} 组</b>：${S.picked.map(nm).join('、')}
        <div class="tags">${S.dropped.map((d) => `<span class="tag">${d.tag}：${d.names.map(nm).join('、')}</span>`).join('')}</div>` },
    { k: '入选的共性', v: `<ul>${S.common.map((t) => `<li>${t}</li>`).join('')}</ul>` },
  ], '竞品筛选逻辑');
}

function v1Render() {
  return `<div class="p1 v1">
    ${head(`相关性 × 爆品度：右上角的 ${PICKED.length} 个就是要对标的竞品`)}
    ${v1Summary()}
    <div class="v1-body">
      <div>
        <figure class="v1-chart" style="margin:0">
          <div class="v1-plot" aria-label="竞品四象限散点图"></div>
          <figcaption class="v1-legend">
            <span><i style="background:var(--accent)"></i>已入选</span>
            <span><i style="background:var(--s-muted)"></i>未入选</span>
            <span><i style="background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3);width:7px;height:7px"></i><i style="background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3);width:14px;height:14px"></i>圆面积 = 候选笔记数</span>
          </figcaption>
        </figure>
        ${dataTable()}
      </div>
      <aside class="v1-side">
        <p class="v1-verdict p1-enter">${verdict()}</p>
        <div><p class="p1-section-title">最终竞品 <span class="num">${PICKED.length} / ${POOL.length}</span></p>${pickCards(80)}</div>
        <details class="p1-details"><summary>其余 ${POOL.length - PICKED.length} 组为什么不选</summary>
          <ul class="p1-rest">${POOL.filter((b) => !b.picked).map((b) => `<li><span class="n">${b.name}</span><span class="num" style="color:var(--ink-3)">${b.relevance} / ${b.heat}</span><span class="w">${b.why}</span></li>`).join('')}</ul>
        </details>
      </aside>
    </div>
  </div>`;
}
function v1Mount(stage) {
  const host = stage.querySelector('.v1-plot');
  const tip = makeTip(stage);
  const ns = 'http://www.w3.org/2000/svg';
  let lastW = 0;
  function draw(animate) {
    const W = Math.round(host.clientWidth);
    if (!W || W === lastW) return;
    lastW = W;
    const small = W < 520;
    const H = Math.round(Math.min(560, Math.max(340, W * 0.7)));
    const pad = { l: small ? 30 : 40, r: small ? 10 : 16, t: 30, b: 34 };
    // widen to 100 when a candidate scores past 90 (e.g. a direct same-category group), so no bubble falls off the chart
    const X0 = 40, X1 = Math.max(90, ...POOL.map((b) => Math.ceil(b.relevance / 10) * 10)), Y0 = 20, Y1 = Math.max(90, ...POOL.map((b) => Math.ceil(b.heat / 10) * 10));
    const x = (v) => pad.l + ((v - X0) / (X1 - X0)) * (W - pad.l - pad.r);
    const y = (v) => pad.t + ((Y1 - v) / (Y1 - Y0)) * (H - pad.t - pad.b);
    const rScale = small ? 0.75 : 1;
    const maxN = Math.max(...POOL.map((b) => b.notes));
    const rad = (n) => (5 + Math.sqrt(n / maxN) * 13) * rScale;
    const fs = small ? 11 : 12;
    let s = `<svg class="v1-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="横轴相关性，纵轴爆品度，${POOL.length} 个品牌">`;
    // core zone
    s += `<rect x="${x(CUT.relevance)}" y="${y(Y1)}" width="${x(X1) - x(CUT.relevance)}" height="${y(CUT.heat) - y(Y1)}" fill="var(--accent)" fill-opacity="0.07" rx="6"/>`;
    // grid
    const step = small ? 20 : 10;
    for (let t = X0; t <= X1; t += 10) {
      s += `<line x1="${x(t)}" x2="${x(t)}" y1="${y(Y1)}" y2="${y(Y0)}" stroke="var(--line)" stroke-width="1"/>`;
      if ((t - X0) % step === 0) s += `<text x="${x(t)}" y="${H - pad.b + 16}" font-size="${fs - 1}" fill="var(--ink-3)" text-anchor="middle" style="font-variant-numeric:tabular-nums">${t}</text>`;
    }
    for (let t = Y0; t <= Y1; t += 10) {
      s += `<line x1="${x(X0)}" x2="${x(X1)}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>`;
      if ((t - Y0) % step === 0 || t === Y1) s += `<text x="${pad.l - 8}" y="${y(t) + 4}" font-size="${fs - 1}" fill="var(--ink-3)" text-anchor="end" style="font-variant-numeric:tabular-nums">${t}</text>`;
    }
    // cutoff lines
    s += `<line x1="${x(CUT.relevance)}" x2="${x(CUT.relevance)}" y1="${y(Y1)}" y2="${y(Y0)}" stroke="var(--line-strong)" stroke-width="1"/>`;
    s += `<line x1="${x(X0)}" x2="${x(X1)}" y1="${y(CUT.heat)}" y2="${y(CUT.heat)}" stroke="var(--line-strong)" stroke-width="1"/>`;
    s += `<text x="${x(CUT.relevance) + 4}" y="${y(Y0) - 6}" font-size="${fs - 2}" fill="var(--ink-3)" style="font-variant-numeric:tabular-nums">${CUT.relevance}</text>`;
    s += `<text x="${x(X0) + 4}" y="${y(CUT.heat) - 5}" font-size="${fs - 2}" fill="var(--ink-3)" style="font-variant-numeric:tabular-nums">${CUT.heat}</text>`;
    s += `<text x="${pad.l}" y="14" font-size="${fs}" fill="var(--ink-2)" font-weight="600">爆品度 ↑</text>`;
    s += `<text x="${W - pad.r}" y="${H - 4}" font-size="${fs}" fill="var(--ink-2)" font-weight="600" text-anchor="end">相关性 →</text>`;
    // quadrant names
    const q = (tx, ty, label, anchor, color = 'var(--ink-3)', weight = 500) =>
      `<text x="${tx}" y="${ty}" font-size="${fs}" fill="${color}" font-weight="${weight}" text-anchor="${anchor}" pointer-events="none">${label}</text>`;
    s += q(x(X1) - 8, y(Y1) + 18, '核心对标', 'end', 'var(--accent-ink)', 650);
    s += q(x(X0) + 8, y(Y1) + 18, '内容借鉴', 'start');
    s += q(x(X1) - 8, y(Y0) - 8, '潜在威胁', 'end');
    s += q(x(X0) + 8, y(Y0) - 8, '忽略', 'start');
    // points: muted first, picked last
    const order = [...POOL].sort((a, b) => (a.picked - b.picked) || (b.notes - a.notes));
    order.forEach((b, i) => {
      const cx = x(b.relevance), cy = y(b.heat), r = rad(b.notes);
      const d = animate && !reduce ? Math.min(i * 30, 420) : 0;
      s += `<g class="v1-pt" tabindex="0" role="img" data-id="${b.id}" aria-label="${b.name}，相关性 ${b.relevance}，爆品度 ${b.heat}，${b.picked ? '已入选' : '未入选'}" ${animate ? '' : 'style="--d:0ms"'}>
        <circle cx="${cx}" cy="${cy}" r="${Math.max(r + 6, 14)}" fill="transparent"/>
        <circle class="mark" cx="${cx}" cy="${cy}" r="${r}" fill="var(${b.picked ? '--accent' : '--s-muted'})" stroke="var(--surface)" stroke-width="2" style="--d:${d}ms${animate ? '' : ';animation:none'}"/>
      </g>`;
    });
    // direct labels on every bubble: picked first (ink, bold), then the rest (muted, lighter).
    // Each tries 8 spots around its mark and takes the first that clears other labels and marks.
    const boxes = POOL.map((b) => { const r = rad(b.notes); return { x0: x(b.relevance) - r, x1: x(b.relevance) + r, y0: y(b.heat) - r, y1: y(b.heat) + r, id: b.id }; });
    boxes.push({ x0: x(X1) - 8 - 4 * fs, x1: x(X1), y0: y(Y1), y1: y(Y1) + 22, id: '_q' });
    boxes.push({ x0: x(X0), x1: x(X0) + 4 * fs + 8, y0: y(Y1), y1: y(Y1) + 22, id: '_q' });
    boxes.push({ x0: x(X1) - 8 - 4 * fs, x1: x(X1), y0: y(Y0) - 22, y1: y(Y0), id: '_q' });
    boxes.push({ x0: x(X0), x1: x(X0) + 2 * fs + 8, y0: y(Y0) - 22, y1: y(Y0), id: '_q' });
    const hit = (a, c) => a.x0 < c.x1 && a.x1 > c.x0 && a.y0 < c.y1 && a.y1 > c.y0;
    const muteLabel = (n) => { const t = n.replace(/（.*?）/g, '').trim(); return t.includes(' / ') ? t.split(' / ')[0] : t; };
    const labelOrder = [...PICKED].sort((a, c) => c.heat - a.heat).concat(POOL.filter((b) => !b.picked).sort((a, c) => c.heat - a.heat));
    for (const b of labelOrder) {
      const cx = x(b.relevance), cy = y(b.heat), r = rad(b.notes);
      const label = b.picked ? short(b.name) : muteLabel(b.name);
      const f = b.picked ? fs : fs - 1;
      const w = [...label].reduce((n, ch) => n + (ch.charCodeAt(0) > 255 ? f : f * 0.55), 0), h = f + 2;
      const dx = r + 6 + w / 2, dy = h / 2 - 2, k = r * 0.75 + 4;
      const cands = [[cx, cy - r - 6], [cx, cy + r + h + 2], [cx + dx, cy + dy], [cx - dx, cy + dy],
        [cx + k + w / 2, cy - k], [cx - k - w / 2, cy - k], [cx + k + w / 2, cy + k + h], [cx - k - w / 2, cy + k + h]];
      let best = null;
      for (const [tx0, ty] of cands) {
        const tx = Math.min(Math.max(tx0, pad.l + w / 2), W - pad.r - w / 2);
        const box = { x0: tx - w / 2 - 2, x1: tx + w / 2 + 2, y0: ty - h, y1: ty + 3 };
        if (box.y0 < 0 || box.y1 > H - pad.b) continue;
        if (!boxes.some((o) => o.id !== b.id && hit(box, o))) { best = [tx, ty, box]; break; }
        if (!best) best = [tx, ty, box];
      }
      boxes.push(best[2]);
      s += b.picked
        ? `<text x="${best[0]}" y="${best[1]}" font-size="${f}" font-weight="650" fill="var(--ink)" text-anchor="middle" pointer-events="none" paint-order="stroke" stroke="var(--surface)" stroke-width="3" stroke-linejoin="round">${label}</text>`
        : `<text x="${best[0]}" y="${best[1]}" font-size="${f}" font-weight="500" fill="var(--ink-2)" text-anchor="middle" pointer-events="none" paint-order="stroke" stroke="var(--surface)" stroke-width="3" stroke-linejoin="round">${label}</text>`;
    }
    s += '</svg>';
    host.innerHTML = s;
    host.querySelectorAll('.v1-pt').forEach((g) => {
      const b = POOL.find((p) => p.id === g.dataset.id);
      g.addEventListener('pointerenter', (e) => { g.setAttribute('data-on', ''); tip.show(b, e.clientX, e.clientY); });
      g.addEventListener('pointermove', (e) => tip.show(b, e.clientX, e.clientY));
      g.addEventListener('pointerleave', () => { g.removeAttribute('data-on'); tip.hide(); });
      g.addEventListener('focus', () => { const r = g.getBoundingClientRect(); tip.show(b, r.right, r.top + r.height / 2); });
      g.addEventListener('blur', () => tip.hide());
      // Click / tap / Enter pins the card (touch has no hover); the same bubble again, outside, or Esc closes it.
      const toggle = (x, y) => { if (tip.pinned === b) tip.unpin(); else tip.pin(b, x, y); };
      g.addEventListener('click', (e) => { e.stopPropagation(); toggle(e.clientX, e.clientY); });
      g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const r = g.getBoundingClientRect(); toggle(r.right, r.top + r.height / 2); } });
    });
  }
  draw(true);
  document.addEventListener('click', (e) => { if (tip.pinned && !tip.el.contains(e.target)) tip.unpin(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && tip.pinned) tip.unpin(); });
  tip.el.addEventListener('click', (e) => { if (e.target.closest('.tip-go')) setTimeout(() => tip.unpin(), 0); });
  addEventListener('scroll', () => { if (tip.pinned) tip.unpin(); }, { passive: true });
  const ro = new ResizeObserver(() => draw(false));
  ro.observe(host);
  addEventListener('scroll', () => tip.hide(), { passive: true });
}

const stage = document.getElementById('competitors-root');
stage.innerHTML = v1Render();
v1Mount(stage);
})();
</script>
<script>/* ---- 竞品爆款 ---- */
(() => {
  const A = window.ATLAS, U = window.AtlasUI, fmt = U.fmt;
  const C = A.competitors;
  const params = new URLSearchParams(location.search);
  let sel = C.some((c) => c.id === params.get('c')) ? params.get('c') : C[0].id;
  const comp = (id) => C.find((c) => c.id === id);
  const setSel = (id) => { sel = id; };
  const SW = ['var(--s1)', 'var(--s2)', 'var(--s3)'];

  const shortName = (c) => c.short || c.name;
  const listShort = (l) => (l || '').split('·').slice(-2, -1).join('');
  const stats = (f) => `<dl class="stats">
      <div><dt>笔记数</dt><dd>${f.n}</dd></div>
      <div><dt>占比</dt><dd>${f.share}%</dd></div>
      <div><dt>爆款率</dt><dd>${f.hitRate}%</dd></div>
      <div><dt>平均百分位</dt><dd>${f.avgPct}</dd></div></dl>`;

  const nc = (n, fid, i = 0) => `<article class="nc enter" style="--i:${i}">
      <a href="#teardown" data-go="teardown" data-f="${fid}" class="cv" aria-label="看拆解：${n.title}">${U.cover(n, { play: false })}</a>
      <div style="display:grid;gap:6px">
        <p class="nc-t">${n.title}</p>
        <p class="nc-m"><span class="acct">${n.account}</span><span>${n.date}</span></p>
        <p class="nc-l"><span class="chip">${n.objective}</span><span class="num" title="${n.list}">榜内 ${Math.round(n.pct)}% · ${listShort(n.list)} 第 ${n.rank}/${n.total}</span></p>
        <p class="nc-a">${U.playLink(n)}<a href="#teardown" data-go="teardown" data-f="${fid}">看拆解 →</a><a class="ext" href="${n.url}" target="_blank" rel="noopener">看原文 ↗</a></p>
      </div></article>`;

  const head = (h1, lede) => `<header class="p2-wrap p2-head">
      <p class="eyebrow">竞品爆款</p><h2>${h1}</h2><p class="lede">${lede}</p></header>`;

  const seg = (label) => `<div class="seg" role="group" aria-label="${label}"><span class="ind" aria-hidden="true"></span>
      ${C.map((c) => `<button type="button" data-c="${c.id}" aria-pressed="${c.id === sel}"><span class="full">${c.name}</span><span class="short">${shortName(c)}</span><small>${c.stats.hits}</small></button>`).join('')}</div>`;

  let segApi = null;
  function wireSeg(root, onChange) {
    const s = root.querySelector('.seg'), ind = s.querySelector('.ind');
    const btns = [...s.querySelectorAll('button')];
    const place = () => { const b = btns.find((x) => x.dataset.c === sel); ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft - 3}px)`; };
    btns.forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.c === sel) return;
      setSel(b.dataset.c);
      btns.forEach((x) => x.setAttribute('aria-pressed', x.dataset.c === sel));
      place(); onChange();
    }));
    segApi = { sync() { btns.forEach((x) => x.setAttribute('aria-pressed', x.dataset.c === sel)); place(); } };
    place(); requestAnimationFrame(() => requestAnimationFrame(() => s.setAttribute('data-ready', '')));
    window.addEventListener('resize', place);
  }

  /* ---------------- V2 Quadrant ---------------- */
  const HIT_T = A.product.cut.hit ?? 80, TR_T = A.product.cut.transfer ?? 60;
  let qFilter = null; // format id or null
  const fIndex = (c, fid) => c.formats.findIndex((f) => f.id === fid);
  const inQ = (d) => d.pct >= HIT_T && d.transfer >= TR_T;

  function v2Panel() {
    const c = comp(sel);
    if (!qFilter) {
      const pts = A.scatter[c.id];
      return `<div class="swap" style="display:grid;gap:12px">
        <p class="eyebrow">爆款 · 好迁移 区里有什么</p>
        <h2 style="display:block">${c.name}</h2>
        <p>每个点是一条笔记。右上角 = 榜内百分位 ≥ ${HIT_T} 且可迁移度 ≥ ${TR_T}，是最值得抄的区域。点一个形式看代表笔记。</p>
        <div style="display:grid;gap:2px;margin:0 -12px">
        ${c.formats.map((f, i) => {
          const all = pts.filter((d) => d.format === f.id), q = all.filter(inQ).length;
          return `<button type="button" class="frow" data-f="${f.id}" style="--sw:${SW[i]}"><i></i>
            <span><b>${f.name}</b><small>${f.n} 条 · 爆款率 ${f.hitRate}% · 平均百分位 ${f.avgPct}</small></span>
            <span class="q">${q}<small>在高价值区</small></span></button>`;
        }).join('')}</div></div>`;
    }
    const i = fIndex(c, qFilter), f = c.formats[i];
    return `<div class="swap" style="display:grid;gap:14px">
      <p class="eyebrow">${c.name} · 形式 0${i + 1}</p>
      <h2 style="--sw:${SW[i]}"><i></i>${f.name}</h2>
      <p>${f.desc}</p>
      ${stats(f)}
      <div class="trio">${f.notes.map((n, j) => nc(n, f.id, j)).join('')}</div>
      <a class="link" href="#teardown" data-go="teardown" data-f="${f.id}">看这个形式的拆解 <span>→</span></a>
    </div>`;
  }

  function v2Legend() {
    const c = comp(sel);
    return `<button type="button" data-f="" aria-pressed="${!qFilter}">全部形式</button>
      ${c.formats.map((f, i) => `<button type="button" data-f="${f.id}" aria-pressed="${qFilter === f.id}" style="--sw:${SW[i]}"><i></i>${f.name}</button>`).join('')}
      <span class="hollow"><b class="f"></b>爆款 <b></b>普通</span>`;
  }

  function drawQuad(stage) {
    const plot = stage.querySelector('.plot');
    const c = comp(sel), pts = A.scatter[c.id];
    const W = plot.clientWidth, H = Math.round(Math.min(460, Math.max(300, W * 0.64)));
    const m = { l: 36, r: 12, t: 28, b: 36 };
    const x = (v) => m.l + (Math.max(0, Math.min(100, v)) / 100) * (W - m.l - m.r);
    const y = (v) => m.t + (1 - v / 100) * (H - m.t - m.b);
    const ns = 'http://www.w3.org/2000/svg';
    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${c.name} 笔记散点：榜内百分位 × 可迁移度">`;
    // highlight quadrant
    s += `<rect x="${x(HIT_T)}" y="${y(100)}" width="${W - m.r - x(HIT_T)}" height="${y(TR_T) - y(100)}" rx="6" fill="var(--accent-soft)"/>`;
    s += `<text x="${W - m.r}" y="${y(100) - 8}" text-anchor="end" style="fill:var(--accent-ink);font-weight:600;font-size:12px">爆款 · 好迁移 ↘</text>`;
    // grid
    [0, 25, 50, 75, 100].forEach((t) => {
      s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" />`;
      s += `<text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
    });
    [0, 20, 40, 60, 80, 100].forEach((v) => {
      s += `<text x="${x(v)}" y="${H - m.b + 18}" text-anchor="${v === 100 ? 'end' : v === 0 ? 'start' : 'middle'}">${v}</text>`;
    });
    s += `<line x1="${x(HIT_T)}" x2="${x(HIT_T)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--line-strong)" />`;
    s += `<text x="${x(HIT_T) - 6}" y="${H - m.b - 8}" text-anchor="end" style="font-size:11px">爆款线 ${HIT_T}</text>`;
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--line-strong)" />`;
    s += `<text x="${m.l - 8}" y="14" text-anchor="start" style="fill:var(--ink-2);font-weight:550">可迁移度 ↑</text>`;
    s += `<text x="${W - m.r}" y="${H - 4}" text-anchor="end" style="fill:var(--ink-2);font-weight:550">榜内百分位 →</text>`;
    // dots: non-hits first, then hits, featured on top
    const order = [...pts].sort((a, b) => (a.hit - b.hit) || (a.example - b.example));
    const pos = [];
    order.forEach((d) => {
      const fi = fIndex(c, d.format), col = SW[fi], cx = x(d.pct), cy = y(d.transfer);
      const dim = qFilter && qFilter !== d.format ? ' opacity="0.12"' : '';
      if (d.hit) s += `<circle class="dot" cx="${cx}" cy="${cy}" r="${d.example ? 6 : 4.5}" fill="${col}" stroke="var(--surface)" stroke-width="2"${dim}/>`;
      else s += `<circle class="dot" cx="${cx}" cy="${cy}" r="${d.example ? 5 : 3.5}" fill="none" stroke="${col}" stroke-opacity="${d.example ? 1 : 0.55}" stroke-width="${d.example ? 2 : 1.25}"${dim}/>`;
      if (d.example) s += `<circle cx="${cx}" cy="${cy}" r="9.5" fill="none" stroke="var(--ink-2)" stroke-width="1"${dim}/>`;
      pos.push({ d, cx, cy, fi });
    });
    // focusable featured notes (keyboard path to tooltip)
    pos.filter((p) => p.d.example).forEach((p) => {
      s += `<circle class="kb" data-note="${p.d.id}" cx="${p.cx}" cy="${p.cy}" r="12" fill="transparent" tabindex="0" role="button" aria-label="${p.d.title.replace(/"/g, '')}，榜内百分位 ${p.d.pct}，可迁移度 ${p.d.transfer}"/>`;
    });
    s += `<circle class="ring" r="9" fill="none" stroke="var(--ink)" stroke-width="1.5" opacity="0" pointer-events="none"/>`;
    s += `<rect class="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/>`;
    s += `</svg><div class="tip" role="status"></div>`;
    plot.innerHTML = s;

    const svg = plot.querySelector('svg'), tip = plot.querySelector('.tip'), ring = svg.querySelector('.ring');
    const show = (p) => {
      if (!p) { tip.removeAttribute('data-show'); ring.setAttribute('opacity', 0); return; }
      const f = c.formats[p.fi];
      tip.textContent = '';
      const st = document.createElement('strong'); st.textContent = `榜内 ${p.d.pct}%`;
      const k = document.createElement('div'); k.className = 'k'; k.style.setProperty('--sw', SW[p.fi]);
      const ki = document.createElement('i'); k.append(ki, document.createTextNode(`${f.name} · ${p.d.hit ? '爆款' : '普通'}`));
      const tr = document.createElement('div'); tr.className = 'k'; tr.textContent = `可迁移度 ${p.d.transfer}`;
      tip.append(st, k, tr);
      const t = document.createElement('div'); t.className = 'tt'; t.textContent = p.d.title;
      const ac = document.createElement('div'); ac.className = 'ac'; ac.textContent = `${p.d.account} · ${p.d.date}`;
      tip.append(t, ac);
      const left = Math.max(80, Math.min(W - 80, p.cx));
      tip.style.left = left + 'px'; tip.style.top = p.cy + 'px';
      tip.setAttribute('data-show', '');
      ring.setAttribute('cx', p.cx); ring.setAttribute('cy', p.cy); ring.setAttribute('opacity', 1);
    };
    const nearest = (e) => {
      const r = svg.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
      let best = null, bd = 24 * 24;
      for (const p of pos) {
        if (qFilter && qFilter !== p.d.format) continue;
        const dd = (p.cx - px) ** 2 + (p.cy - py) ** 2;
        if (dd < bd) { bd = dd; best = p; }
      }
      return best;
    };
    const hit = svg.querySelector('.hit');
    hit.addEventListener('pointermove', (e) => show(nearest(e)));
    hit.addEventListener('pointerleave', () => show(null));
    hit.addEventListener('click', (e) => { const p = nearest(e); if (p) v2Set(stage, p.d.format); });
    svg.querySelectorAll('.kb').forEach((el) => {
      const p = pos.find((q) => q.d.id === el.dataset.note);
      el.addEventListener('focus', () => show(p));
      el.addEventListener('blur', () => show(null));
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); v2Set(stage, p.d.format); } });
      el.addEventListener('click', () => v2Set(stage, p.d.format));
    });
  }

  function chead() {
    const c = comp(sel), st = c.stats;
    return `<span class="kind">${c.kind} · ${c.tagline}</span>
      <dl class="stats"><div><dt>笔记</dt><dd>${st.notes}</dd></div><div><dt>账号</dt><dd>${st.accounts}</dd></div><div><dt>爆款</dt><dd>${st.hits}</dd></div><div><dt>爆款率</dt><dd>${st.hitRate}%</dd></div><div><dt>中位百分位</dt><dd>${st.medianPct}</dd></div></dl>
      <span class="obj">投放目标 ${c.objectives.map(([k, v]) => `<span class="chip">${k} ${v}</span>`).join('')}</span>`;
  }
  function zsum() {
    const c = comp(sel), z = c.zone;
    return U.summary([
      { k: '池子', v: `${c.name}的 <b class="num">${z.total}</b> 条笔记，来自 <span class="num">${c.stats.accounts}</span> 个账号` },
      { k: '怎么筛', v: `榜内百分位 ≥ ${HIT_T} 算爆款（<span class="num">${z.hits}</span> 条）；可迁移度 ≥ ${TR_T} 算${AtlasUI.nm(A.product.name)}能照着做` },
      { k: '结果', v: `右上角 <b class="num">${z.n}</b> 条<div class="tags">${z.byFormat.map(([k, v]) => `<span class="tag">${k} ${v}</span>`).join('')}</div>` },
      { k: '共性', v: z.takeaway },
    ], '爆款筛选逻辑');
  }
  function v2Set(stage, fid) {
    qFilter = fid || null;
    stage.querySelector('.zsum').innerHTML = zsum();
    stage.querySelector('.chead').innerHTML = chead();
    stage.querySelector('.legend').innerHTML = v2Legend();
    stage.querySelector('.panel').innerHTML = v2Panel();
    drawQuad(stage); wireV2Bits(stage);
  }
  function wireV2Bits(stage) {
    stage.querySelectorAll('.legend button').forEach((b) => b.addEventListener('click', () => v2Set(stage, b.dataset.f === qFilter ? '' : b.dataset.f)));
    stage.querySelectorAll('.panel .frow').forEach((b) => b.addEventListener('click', () => v2Set(stage, b.dataset.f)));
  }
  const V2 = {
    render: () => { const f0 = params.get('f'); qFilter = comp(sel).formats.some((f) => f.id === f0) ? f0 : null; return `<div class="v2">
      ${head('哪些爆款值得抄：榜内百分位 × 可迁移度', `横轴是笔记在聚光 / 蒲公英榜单里的百分位（≥ ${HIT_T} 算爆款）；纵轴可迁移度是判断分：${A.product.copy?.transferDef ?? `${AtlasUI.nm(A.product.name, 'right')}能不能低成本照着做、和${AtlasUI.nm(A.product.name)}的叙事是否一致`}。右上角是又火又好抄的，最值得${AtlasUI.nm(A.product.name)}照着做。`)}
      <div class="p2-wrap">
        <div class="bar">${seg('选择竞品')}</div>
        <div class="chead">${chead()}</div>
        <div class="zsum">${zsum()}</div>
        <div class="grid">
          <div class="chart-card"><div class="legend" role="group" aria-label="按形式筛选">${v2Legend()}</div><div class="plot"></div>
            <p class="note">实心 = 爆款（榜内百分位 ≥ 80），空心 = 普通笔记；带外圈的是选出的代表笔记，可用 Tab 键聚焦。${A.product.dataNote}。</p></div>
          <aside class="panel" aria-live="polite">${v2Panel()}</aside>
        </div>
      </div></div>`; },
    mount(stage) {
      wireSeg(stage, () => v2Set(stage, ''));
      drawQuad(stage); wireV2Bits(stage);
      const ro = new ResizeObserver(() => drawQuad(stage));
      ro.observe(stage.querySelector('.chart-card'));
    },
  };


  const stage = document.getElementById('hits-root');
  stage.innerHTML = V2.render();
  V2.mount(stage);
  window.Brief.on('hits', ({ c, f }) => {
    if (c && C.some((x) => x.id === c)) setSel(c);
    segApi && segApi.sync();
    v2Set(stage, f && comp(sel).formats.some((x) => x.id === f) ? f : '');
  });
})();
</script>
<script>/* ---- 爆款拆解 ---- */
(() => {
  const A = window.ATLAS;
  const { cover } = AtlasUI;
  // fully torn-down formats, in competitor order (the rest carry `inherit: true`)
  const DONE = A.competitors.flatMap((c) => c.formats.map((f) => f.id)).filter((id) => A.teardowns[id] && !A.teardowns[id].inherit);
  const POS = ['标题', '封面', '正文', '话题'];
  const PRODUCT = A.product.name;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const p0 = (v) => Math.round(v) + '%';

  // note id → format id, covering every note in the pool (laws can cite notes that aren't format examples)
  const FMT = {};
  for (const c in A.scatter) for (const s of A.scatter[c]) FMT[s.id] = s.format;
  for (const id in A.notes) FMT[id] = A.notes[id].format;

  let fid = new URLSearchParams(location.search).get('f') || DONE[0];

  function find(id) {
    for (const c of A.competitors) for (const f of c.formats) if (f.id === id) return { c, f };
    return null;
  }
  if (!find(fid)) fid = DONE[0];

  function ctx() {
    const { c, f } = find(fid);
    const td = A.teardowns[f.id];
    const hero = A.notes[td.hero];
    const law = A.laws.find((l) => l.examples.some((e) => FMT[e] === f.id)) || A.laws[0];
    return { c, f, td, hero, law };
  }

  // ---------- pieces ----------
  const switcher = () => `<div class="td-switch" role="group" aria-label="切换拆解">${DONE.map((id) => {
    const { c, f } = find(id);
    return `<button type="button" data-f="${id}" aria-pressed="${id === fid}" aria-label="${esc(c.name)}：${esc(f.name)}"><span class="c"><span class="c-full">${esc(c.name)}</span><span class="c-short">${esc(c.short || c.name)}</span></span><span class="fn">${esc(f.name)}</span></button>`;
  }).join('')}</div>`;

  const head = (x) => `<header class="td-head td-in">
    <p class="eyebrow">爆款拆解 · ${esc(x.c.name)} · ${esc(x.c.kind)}</p>
    <h2>${esc(x.f.name)}</h2>
    <p class="desc">${esc(x.f.desc)}</p>
    <div class="td-meta num"><span>占该竞品笔记 <b>${x.f.share}%</b>（${x.f.n} 条）</span><span>爆款率 <b>${x.f.hitRate}%</b></span><span>平均榜内百分位 <b>${p0(x.f.avgPct)}</b></span><span>${esc(x.f.type)}为主</span></div>
    <div style="margin-top:6px">${switcher()}</div>
  </header>`;

  const steps = (s, inferred = []) => `<ol class="steps">${s.map((r) => `<li><span class="t">${esc(r.t)}</span><span>${esc(r.d)}${inferred.includes(r.t) ? '<span class="inf" title="没有拿到视频，根据标题和封面推断">推断</span>' : ''}</span></li>`).join('')}</ol>`;
  const whys = (w) => `<ol class="whys">${w.map((r) => `<li>${esc(r)}</li>`).join('')}</ol>`;
  const chain = (st) => `<ol class="chain">${st.map((r) => `<li><b>${esc(r.k)}</b><span>${esc(r.d)}</span></li>`).join('')}</ol>`;
  const apply = (x) => `<a class="apply" href="#playbook" data-go="playbook" data-law="${x.law.id}"><span class="lbl">放到${esc(AtlasUI.nm(PRODUCT))}上</span><span>${esc(x.law.name)}：${esc(x.law.apply.title)}</span><span class="go">看落地 →</span></a>`;

  const noteCap = (n) => `<div class="cap">
    <b>${esc(n.title)}</b>
    <span class="td-muted num">@${esc(n.account)} · ${esc(n.date)}</span>
    <span class="td-muted num">榜内 ${p0(n.pct)} · ${esc(n.objective)}${n.featured ? ' · 精选' : ''}</span>
    <a href="${esc(n.url)}" target="_blank" rel="noopener">看原文 ↗</a>
  </div>`;

  const sibs = (x) => {
    const rest = x.f.notes.filter((n) => n.id !== x.hero.id).slice(0, 2);
    if (!rest.length) return '';
    return `<div class="sibs-h">同形式的另外 ${rest.length} 条</div><div class="sibs">${rest.map((n) => `<a href="${esc(n.url)}" target="_blank" rel="noopener" title="${esc(n.title)}"${n.video || n.images?.length ? ` data-view="${n.id}"` : ''}>${cover(n, { play: false })}<span>${esc(n.title)}</span></a>`).join('')}</div>`;
  };

  const MAG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>';

  // 流量从哪来: 定量 = real leaderboard records (when any) + 定性 (always, read from the note itself)
  function traffic(t) {
    const q = t.quant, ql = t.qual;
    const quant = q ? `<div class="layer">
        <div class="layer-h"><b>定量</b><span>数据：${esc(q.from)}</span></div>
        <p class="q-sum">${esc(q.summary)}</p>
        <ul class="recs" aria-label="上榜记录">${q.lists.map((r, i) => `<li title="${esc(r.list)}">
          <span class="td-chip">${esc(r.objective)}</span>
          <span class="m">${esc(r.metric)} <span>· 近 ${r.window} 日</span></span>
          <span class="rk num">第 <b>${r.rank}</b> / ${r.total}</span>
          <span class="trk" aria-hidden="true"><span class="td-grow" style="--i:${i};width:${((1 - (r.rank - 1) / r.total) * 100).toFixed(1)}%"></span></span>
        </li>`).join('')}</ul>
        <div class="foot"><span>条越长，排名越靠前。只有排名，没有曝光和点击的绝对数。</span></div>
      </div>` : '';
    const qual = `<div class="layer">
        <div class="layer-h"><b>定性</b><span>根据笔记的标题、封面、正文、话题判断</span></div>
        <div class="verdict"><strong>${esc(ql.verdict)}</strong><p>${esc(ql.reason)}</p></div>
        <table class="kw">
          <thead><tr><th scope="col">带流量的词</th><th scope="col">出现在</th><th scope="col">作用</th><th scope="col">说明</th></tr></thead>
          <tbody>${ql.keywords.map((k) => `<tr>
            <td class="w">${esc(k.w)}</td>
            <td class="where-td"><span class="where" aria-label="出现在：${esc(k.where.join('、'))}">${POS.map((p) => `<span class="${k.where.includes(p) ? 'on' : 'off'}" aria-hidden="true">${p}</span>`).join('')}</span></td>
            <td class="role"><span class="td-chip">${esc(k.role)}</span></td>
            <td class="note">${esc(k.note)}</td>
          </tr>`).join('')}</tbody>
        </table>
        <div class="lt"><span class="lt-h">可能搜到它的长尾词</span><ul>${ql.longtail.map((w) => `<li>${MAG}${esc(w)}</li>`).join('')}</ul></div>
      </div>`;
    return `<section class="td-card traffic td-in" style="--i:4" aria-labelledby="tr-h">
      <div class="td-lbl"><h2 id="tr-h">流量从哪来</h2><span class="td-chip">${q ? '定量 + 定性' : '仅定性'}</span></div>
      ${q ? '' : '<p class="nodata">拿不到这条笔记的榜单或后台数据，下面是根据笔记内容做的定性判断。</p>'}
      <div class="layers${q ? '' : ' qual-only'}">${quant}${qual}</div>
    </section>`;
  }

  function empty(x) {
    return `<div class="td td-in">
      ${head(x)}
      <div class="empty">
        ${cover(x.hero)}
        <div class="msg">
          <h2>这一条还没拆</h2>
          <p class="td-sub">「${esc(x.f.name)}」已经进了爆款池，账号、流量和变现还没拆。先看已经拆完的 ${DONE.length} 条：</p>
          <div class="stats num"><span>占比<b>${x.f.share}%</b></span><span>爆款数<b>${x.f.hits}</b></span><span>平均百分位<b>${p0(x.f.avgPct)}</b></span><span>爆款率<b>${x.f.hitRate}%</b></span></div>
          <ul class="done">${DONE.map((id) => { const o = find(id); return `<li><a href="#teardown" data-f="${id}">${esc(o.f.name)}<span>${esc(o.c.name)}</span></a></li>`; }).join('')}</ul>
        </div>
      </div>
    </div>`;
  }

  function page(x) {
    const { td } = x, a = td.account;
    return `<div class="td">
      ${head(x)}
      <div class="td-grid">
        <div class="td-card hero td-in" style="--i:1">${cover(x.hero)}${noteCap(x.hero)}${sibs(x)}</div>
        <section class="td-card acct td-in" style="--i:2">
          <div class="td-lbl"><h2>账号是谁</h2></div>
          <div><span class="name">${esc(a.name)}</span> <span class="td-muted">· ${esc(a.kind)}</span></div>
          <div class="kpis num">
            <span><b>${a.inLib}</b>条在素材库</span>
            ${a.matrix ? `<span><b>${a.matrix.notes} 条 / ${a.matrix.accounts} 个号</b>同一活动</span>` : `<span><b>${p0(x.hero.pct)}</b>榜内百分位</span>`}
          </div>
          <p class="td-muted">${esc(a.note)}</p>
        </section>
        <section class="td-card fun td-in" style="--i:3">
          <div class="td-lbl"><h2>怎么变现</h2><span>${esc(td.money.price)}</span></div>
          ${chain(td.money.steps)}
          <p class="td-muted">${esc(td.money.path)}</p>
        </section>
        <section class="td-card struct td-in" style="--i:5"><div class="td-lbl"><h2>内容怎么搭</h2><span>${esc(x.f.type)}</span></div>${steps(td.structure, td.inferred || [])}</section>
        <section class="td-card why td-in" style="--i:6"><div class="td-lbl"><h2>为什么有效</h2></div>${whys(td.why)}</section>
        ${traffic(td.traffic)}
        <div class="apply-wrap td-in" style="--i:7">${apply(x)}</div>
      </div>
    </div>`;
  }

  // ---------- render ----------
  const stage = document.getElementById('teardown-root');
  function render(focusF) {
    const x = ctx();
    stage.innerHTML = x.td.inherit ? empty(x) : page(x);
    stage.querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', (e) => go(b.dataset.f, e)));
    if (focusF) stage.querySelector(`.td-switch [data-f="${focusF}"]`)?.focus({ preventScroll: true });
  }
  function go(id, e) {
    e?.preventDefault();
    fid = id;
    render(id);
  }

  render();
  window.Brief.on('teardown', ({ f }) => { if (f && find(f)) { fid = f; render(); } });
})();
</script>
<script>/* ---- 规律与落地 ---- */
(function () {
  const A = window.ATLAS, P = A.product, laws = A.laws;
  const { cover } = AtlasUI;

  // product mock cover per law (synthetic text cover until the real one is made): law.mock, else built from apply.title
  const mockOf = (l, i) => l.mock || { cover: l.apply.title.replace(/[「」]/g, ''), pal: i % 3, person: false, type: '图文' };
  const compName = (id) => A.competitors.find((c) => c.id === id)?.name ?? '';
  const steps = (s) => s.split(/\s*(?:→|\+|，|；)\s*/).filter(Boolean);
  const tbc = /^待确认[：:]\s*/;
  const goal = tbc.test(P.goal) ? `<span class="tbc">待确认</span>${P.goal.replace(tbc, '')}` : P.goal;

  const head = () => `
    <header class="p4-head rise">
      <p class="eyebrow">规律与落地</p>
      <h2>${laws.length} 条规律，落到${AtlasUI.nm(P.name, 'left')}</h2>
      <p><b>${P.name}</b>：${P.oneLine}。</p>
      <p>本轮目标：${goal}</p>
    </header>`;

  // evidence is either a with/without hit-rate comparison or a list of campaigns (notes vs accounts)
  const bar = (label, n, v, muted) => `
    <div class="ev-row${muted ? ' is-muted' : ''}">
      <span>${label} <span class="n">${n}</span></span><b>${v}%</b>
      <span class="ev-track"><span class="ev-fill" style="width:${v}%"></span></span>
    </div>`;
  const ev = (l) => {
    const e = l.evidence;
    if (e.campaigns) return `
    <figure class="ev" aria-label="${e.campaigns.map((c) => `${c.name}：${c.notes} 条笔记来自 ${c.accounts} 个号`).join('；')}">
      <figcaption class="ev-cap">每个点是一个账号</figcaption>
      ${e.campaigns.map((c) => `
        <div class="ev-row">
          <span>${c.name}</span><span class="n">${c.notes} 条 / <b>${c.accounts}</b> 个号</span>
          <span class="ev-dots" aria-hidden="true">${'<i></i>'.repeat(c.accounts)}</span>
        </div>`).join('')}
    </figure>`;
    return `
    <figure class="ev" aria-label="有这个特征的 ${e.with} 条笔记爆款率 ${e.withHit}%，没有的 ${e.without} 条爆款率 ${e.withoutHit}%">
      <figcaption class="ev-cap">爆款率（榜内前 20%）· 共 ${e.of} 条竞品笔记</figcaption>
      ${bar('有这个特征', `${e.with} 条`, e.withHit)}
      ${bar('没有', `${e.without} 条`, e.withoutHit, true)}
    </figure>`;
  };

  const mock = (l, cls = 'mock') => `<div class="${cls}" role="img" aria-label="${AtlasUI.nm(P.name, 'right')}版本封面，待制作">${cover(mockOf(l, laws.indexOf(l)), { tag: false })}</div>`;
  const badge = `<span class="mock-badge">${AtlasUI.nm(P.name, 'right')}版本 · 待制作</span>`;

  /* ---------------- 映射 ---------------- */
  const v2Panel = (l) => `
    <div class="v2-claim">
      <h2>${l.claim}</h2>
      ${ev(l)}
    </div>
    <div class="v2-panes">
      <div class="v2-pane">
        <h3>竞品怎么做 <span class="num">${l.examples.length} 个例子</span></h3>
        ${l.examples.map((id) => { const n = A.notes[id]; return `
          <div class="v2-row">
            <a class="v2-row-cov" href="#teardown" data-go="teardown" data-f="${n.format}" tabindex="-1" aria-hidden="true">${cover(n, { tag: false, play: false })}</a>
            <span>
              <a class="v2-row-t" href="#teardown" data-go="teardown" data-f="${n.format}">${n.title}</a>
              <span class="v2-row-m">${n.account} · ${compName(n.competitor)} · ${n.type}</span>
              <span class="v2-row-l">${AtlasUI.playLink(n)}<a href="#teardown" data-go="teardown" data-f="${n.format}">看拆解</a><a href="${n.url}" target="_blank" rel="noopener">看原文 ↗</a></span>
            </span>
            <span class="v2-row-n">榜内 ${Math.round(n.pct)}%<small>${n.objective}</small></span>
          </div>`; }).join('')}
      </div>
      <div class="v2-pane">
        <h3>${AtlasUI.nm(P.name, 'right')}怎么做 ${badge}</h3>
        <div class="v2-me">
          ${mock(l)}
          <div>
            <h4>${l.apply.title}</h4>
            <p class="sub">封面：${l.apply.cover}</p>
            <ol class="steps-list">${steps(l.apply.script).map((s) => `<li>${s}</li>`).join('')}</ol>
            <p class="kpi"><b>建议指标</b>${l.apply.kpi.replace(/^建议看[：:]\s*/, '')}</p>
          </div>
        </div>
      </div>
    </div>`;
  const initial = Math.max(0, laws.findIndex((l) => l.id === new URLSearchParams(location.search).get('law')));

  const page = () => `<div class="p4">${head()}
    <div class="rise" style="--i:1">
      <div class="seg" role="tablist" aria-label="选择规律">
        <span class="seg-hl" aria-hidden="true"></span>
        ${laws.map((l, i) => `<button role="tab" id="tab-${l.id}" data-law="${l.id}" aria-selected="${i === initial}" tabindex="${i === initial ? 0 : -1}" aria-controls="law-panel"><span class="lawdot"></span>${l.name}</button>`).join('')}
      </div>
      <div class="v2-panel" id="law-panel" role="tabpanel" aria-labelledby="tab-${laws[initial].id}" data-law="${laws[initial].id}">${v2Panel(laws[initial])}</div>
    </div></div>`;

  function mount(stage) {
    const seg = stage.querySelector('.seg'), hl = seg.querySelector('.seg-hl'), panel = stage.querySelector('.v2-panel');
    const btns = [...seg.querySelectorAll('button')];
    let cur = initial;
    const place = (i) => { const b = btns[i]; hl.style.width = b.offsetWidth + 'px'; hl.style.transform = `translateX(${b.offsetLeft - 4}px)`; };
    hl.style.transition = 'none';
    place(cur);
    requestAnimationFrame(() => requestAnimationFrame(() => { hl.style.transition = ''; }));
    new ResizeObserver(() => place(cur)).observe(seg);
    function select(i, focus) {
      if (focus) btns[i].focus();
      if (i === cur) return;
      cur = i;
      btns.forEach((x, j) => { x.setAttribute('aria-selected', String(j === i)); x.tabIndex = j === i ? 0 : -1; });
      place(i);
      const l = laws[i];
      panel.dataset.law = l.id;
      panel.setAttribute('aria-labelledby', `tab-${l.id}`);
      panel.innerHTML = v2Panel(l);
      panel.classList.remove('swap'); void panel.offsetWidth; panel.classList.add('swap');
    }
    btns.forEach((b, i) => b.addEventListener('click', () => select(i)));
    window.Brief.on('playbook', ({ law }) => { const i = laws.findIndex((l) => l.id === law); if (i >= 0) select(i); });
    seg.addEventListener('keydown', (e) => {
      const n = btns.length;
      const next = { ArrowRight: cur + 1, ArrowLeft: cur - 1, Home: 0, End: n - 1 }[e.key];
      if (next === undefined) return;
      e.preventDefault();
      select((next + n) % n, true);
    });
  }

  const stage = document.getElementById('playbook-root');
  stage.innerHTML = page();
  mount(stage);
})();
</script>
<script>
  AtlasUI.topBar();
  document.getElementById('foot-src').textContent = `Atlas · ${ATLAS.product.name} 竞品爆款 Brief · ${ATLAS.product.pool.source}`;
</script>
</body>
