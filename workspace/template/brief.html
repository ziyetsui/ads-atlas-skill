<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { const t = localStorage.getItem('atlas-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<title>Atlas Brief</title>
<link rel="stylesheet" href="../assets/base.css">
<style>

  /* one-page brief frame */
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  .brief > section { scroll-margin-top: 64px; }
  .brief > section + section { padding-top: 136px; }
  @media (max-width: 720px) { .brief > section + section { padding-top: 104px; } }
  .brief-foot { max-width: 1200px; margin: 136px auto 0; padding: 0 24px 48px; font-size: 13px; color: var(--ink-3); }
  .brief-foot > div { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .brief-foot a { color: var(--ink-2); text-decoration: none; transition: color 150ms ease; }
  @media (hover: hover) and (pointer: fine) { .brief-foot a:hover { color: var(--ink); } }
  @media (max-width: 720px) { .brief-foot { margin-top: 104px; padding: 0 16px 40px; } }

/* keyframes hoisted out of the section scopes (they can't nest) */
@keyframes cv-in { to { opacity: 1; transform: none; } }
@keyframes p1-in { from { opacity: 0; transform: translateY(6px); } }
@keyframes p1-fade { from { opacity: 0; } }
@keyframes v1-pop { from { opacity: 0; transform: scale(0.6); } }
@keyframes p2-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes p2-fade { from { opacity: 0; } }
@keyframes td-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes td-grow { from { transform: scaleX(0.02); } }
@keyframes td-fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes swap { from { opacity: 0; transform: translateY(4px); } }

/* ================= product ================= */
#product {

  .cv { max-width: 1200px; margin: 0 auto; padding: 72px 24px 0; }
  .cv h1 { font-family: var(--font-serif); font-weight: 900; font-size: clamp(36px, 5vw, 56px); line-height: 1.1; letter-spacing: -0.02em; margin-top: 12px; }
  .cv .lede { margin-top: 16px; font-size: 17px; color: var(--ink-2); max-width: 46ch; }
  .cv-facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; margin-top: 48px; padding: 24px 0; border-block: 1px solid var(--line); }
  .cv-facts dt { font-size: 12px; color: var(--ink-3); }
  .cv-facts dd { margin: 4px 0 0; font-size: 14px; }
  .cv-goal { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; margin-top: 20px; font-size: 14px; }
  .cv-goal b { font-weight: 600; }
  .cv-sp { display: flex; flex-wrap: wrap; gap: 8px; }
  .cv-sp span { padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; }
  .cv-steps { list-style: none; padding: 0; margin: 56px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .cv-steps a {
    display: flex; flex-direction: column; gap: 8px; height: 100%; padding: 20px; border-radius: var(--r-lg);
    background: var(--surface); box-shadow: var(--shadow-1); text-decoration: none;
    transition: box-shadow 200ms var(--ease-out), transform 160ms var(--ease-out);
  }
  @media (hover: hover) and (pointer: fine) { .cv-steps a:hover { box-shadow: var(--shadow-2); } }
  .cv-steps a:active { transform: scale(0.98); }
  .cv-steps .t { font-weight: 600; font-size: 16px; }
  .cv-steps .d { font-size: 13px; color: var(--ink-2); }
  .cv-steps .go { margin-top: auto; padding-top: 8px; font-size: 13px; color: var(--ink-3); }
  .cv-src { margin-top: 24px; font-size: 12px; color: var(--ink-3); }
  .cv-steps li { opacity: 0; transform: translateY(8px); animation: cv-in 300ms var(--ease-out) forwards; }
  .cv-steps li:nth-child(2) { animation-delay: 50ms; } .cv-steps li:nth-child(3) { animation-delay: 100ms; } .cv-steps li:nth-child(4) { animation-delay: 150ms; }
  
  @media (prefers-reduced-motion: reduce) { .cv-steps li { animation: none; opacity: 1; transform: none; } }
  @media (max-width: 860px) { .cv-facts, .cv-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .cv { padding: 48px 16px 0; } .cv-facts, .cv-steps { grid-template-columns: 1fr; } }

}
/* ================= competitors ================= */
#competitors {

  .p1 { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  @media (max-width: 720px) { .p1 { padding: 0 16px; } }
  .p1-head { display: grid; gap: 10px; max-width: 880px; }
  .p1-src, .p1-defs { max-width: 72ch; }
  .p1-head h2 { font-size: clamp(24px, 3vw, 32px); font-weight: 650; letter-spacing: -0.02em; line-height: 1.25; }
  .p1-src { font-size: 13px; color: var(--ink-3); }
  .p1-defs { display: grid; gap: 4px; margin: 6px 0 0; font-size: 13.5px; color: var(--ink-2); }
  .p1-defs div { display: flex; gap: 8px; }
  .p1-defs dt { flex: none; font-weight: 600; color: var(--ink); }
  .p1-defs dd { margin: 0; }
  .p1-section-title { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; display: flex; align-items: baseline; gap: 8px; }
  .p1-section-title .num { color: var(--ink-3); font-weight: 500; }

  .p1-picks { display: grid; gap: 12px; }
  .p1-pick {
    position: relative; display: grid; gap: 6px; padding: 16px 16px 14px;
    background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-1);
  }
  .p1-pick-top { display: flex; align-items: center; gap: 8px; }
  .p1-pick-rank { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .p1-pick-name { font-weight: 650; letter-spacing: -0.01em; }
  .p1-kind { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
  .p1-pick-metrics { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .p1-pick-why { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
  .p1-pick-link {
    justify-self: start; display: inline-flex; align-items: center; gap: 4px; margin-top: 2px;
    min-height: 32px; font-size: 13px; font-weight: 600; color: var(--accent-ink); text-decoration: none;
    touch-action: manipulation; transition: transform 160ms var(--ease-out);
  }
  .p1-pick-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; } /* card-wide hit area, link stays the only control */
  .p1-pick-link span { transition: transform 200ms var(--ease-out); }
  @media (hover: hover) and (pointer: fine) {
    .p1-pick:hover .p1-pick-link span { transform: translateX(3px); }
  }
  .p1-pick:has(.p1-pick-link:active) { transform: scale(0.98); }
  .p1-pick { transition: transform 160ms var(--ease-out); }

  .p1-tip {
    position: fixed; z-index: 300; left: 0; top: 0; pointer-events: none;
    max-width: 260px; padding: 10px 12px; border-radius: 10px;
    background: var(--surface); box-shadow: var(--shadow-2);
    font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
    opacity: 0; transform: translateY(2px); transition: opacity 120ms ease-out, transform 120ms ease-out;
  }
  .p1-tip[data-on] { opacity: 1; transform: none; }
  .p1-tip[data-pinned] { pointer-events: auto; }
  .p1-tip .tip-go { display: inline-block; margin-top: 8px; color: var(--accent-ink); font-weight: 600; text-decoration: none; }
  @media (hover: hover) and (pointer: fine) { .p1-tip .tip-go:hover { text-decoration: underline; text-underline-offset: 3px; } }
  .p1-tip .tip-hint { margin-top: 6px; font-size: 11.5px; color: var(--ink-3); }
  .p1-tip b { color: var(--ink); font-weight: 650; font-size: 13.5px; }
  .p1-tip .row { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; }
  .p1-tip .row strong { color: var(--ink); font-weight: 600; }
  .p1-tip .why { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }

  .p1-details { margin-top: 12px; font-size: 13px; }
  .p1-details summary { cursor: pointer; color: var(--ink-2); min-height: 36px; display: flex; align-items: center; gap: 6px; list-style: none; touch-action: manipulation; }
  .p1-details summary::-webkit-details-marker { display: none; }
  .p1-details summary::before { content: "▸"; font-size: 10px; color: var(--ink-3); transition: transform 160ms var(--ease-out); }
  .p1-details[open] summary::before { transform: rotate(90deg); }
  .p1-table-wrap { overflow-x: auto; margin-top: 8px; border-radius: var(--r-sm); box-shadow: var(--shadow-1); background: var(--surface); }
  .p1-table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .p1-table th, .p1-table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .p1-table th:first-child, .p1-table td:first-child { text-align: left; }
  .p1-table th { font-weight: 600; color: var(--ink-3); font-size: 11.5px; }
  .p1-table tr:last-child td { border-bottom: 0; }
  .p1-table tr[data-picked] td:first-child { color: var(--accent-ink); font-weight: 600; }

  .p1-rest { display: grid; gap: 8px; margin-top: 8px; }
  .p1-rest li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
  .p1-rest .n { font-weight: 600; color: var(--ink); }
  .p1-rest .w { grid-column: 1 / -1; color: var(--ink-3); }
  ul.p1-rest { list-style: none; padding: 0; margin: 8px 0 0; }

  .p1-enter { animation: p1-in 280ms var(--ease-out) both; animation-delay: var(--d, 0ms); }
  
  @media (prefers-reduced-motion: reduce) {
    .p1-enter { animation: p1-fade 200ms ease both; }
    
  }

  /* ---------- V1 scatter ---------- */
  .v1-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; margin-top: 32px; align-items: start; }
  @media (max-width: 960px) { .v1-body { grid-template-columns: 1fr; gap: 28px; } }
  .v1-chart { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: 16px 12px 12px; }
  .v1-svg { display: block; width: 100%; overflow: visible; }
  .v1-svg text { font-family: var(--font-sans); }
  .v1-pt { cursor: pointer; outline: none; }
  .v1-pt .mark { transition: stroke-width 120ms ease-out; transform-box: fill-box; transform-origin: center; }
  .v1-pt:focus-visible .mark, .v1-pt[data-on] .mark { stroke: var(--ink); stroke-width: 2; }
  .v1-pt .mark { animation: v1-pop 300ms var(--ease-out) both; animation-delay: var(--d, 0ms); }
  
  @media (prefers-reduced-motion: reduce) { .v1-pt .mark { animation: p1-fade 200ms ease both; } }
  .v1-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 8px 2px; font-size: 12px; color: var(--ink-2); }
  .v1-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .v1-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .v1-side { display: grid; gap: 16px; position: sticky; top: 72px; }
  @media (max-width: 960px) { .v1-side { position: static; } }
  .v1-verdict { font-size: 15px; color: var(--ink-2); line-height: 1.6; }
  .v1-verdict strong { color: var(--ink); font-weight: 650; }
  @media (hover: hover) and (pointer: fine) { .p1-next a:hover { color: var(--ink); } .p1-next a:hover span { transform: translateX(3px); } }

}
/* ================= hits ================= */
#hits {


  /* ---------- page-shared bits ---------- */
  .p2 { --gut: 24px; }
  .p2-wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--gut); }
  .p2-head { padding-top: 0; padding-bottom: 28px; display: grid; gap: 10px; }
  .p2-head h2 { font-size: clamp(24px, 2.4vw + 12px, 34px); font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; }
  .p2-head .lede { color: var(--ink-2); max-width: 60ch; }
  @media (max-width: 720px) { .p2 { --gut: 16px; } .p2-head { padding-top: 0; } }

  button, a { touch-action: manipulation; }

  /* segmented control with sliding indicator */
  .seg { position: relative; display: inline-flex; padding: 3px; gap: 0; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); max-width: 100%; overflow-x: auto; scrollbar-width: none; isolation: isolate; }
  .seg button { position: relative; z-index: 1; height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: none; color: var(--ink-2); font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: color 150ms ease; }
  .seg button[aria-pressed="true"] { color: var(--ink); }
  .seg button:active { transform: scale(0.97); }
  .seg button small { color: var(--ink-3); font-size: 12px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .seg .short { display: none; }
  .seg .ind { position: absolute; z-index: 0; top: 3px; left: 0; height: 38px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-1); pointer-events: none; }
  .seg[data-ready] .ind { transition: transform 250ms var(--ease-out), width 250ms var(--ease-out); }
  @media (hover: hover) and (pointer: fine) { .seg button:hover { color: var(--ink); } }
  @media (max-width: 520px) {
    .seg { display: flex; width: 100%; overflow: visible; }
    .seg button { flex: 1 1 0; min-width: 0; padding: 0 6px; font-size: 13px; }
    .seg button small { display: none; }
    .seg .full { display: none; }
    .seg .short { display: inline; }
  }

  .stats { display: flex; gap: 20px; margin: 0; }
  .stats div { display: grid; gap: 0; }
  .stats dt { font-size: 12px; color: var(--ink-3); }
  .stats dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; }

  .link { display: inline-flex; align-items: center; gap: 4px; color: var(--accent-ink); font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .link span { transition: transform 200ms var(--ease-out); }
  @media (hover: hover) and (pointer: fine) { .link:hover span { transform: translateX(3px); } }

  .nc { display: grid; gap: 10px; min-width: 0; align-content: start; }
  .nc .cover-wrap { transition: transform 160ms var(--ease-out); }
  .nc:active .cover-wrap { transform: scale(0.97); }
  .nc-t { font-size: 14px; font-weight: 550; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .nc-m { display: flex; gap: 10px; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
  .nc-m .acct { overflow: hidden; text-overflow: ellipsis; min-width: 0; color: var(--ink-2); }
  .nc-l { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 11px; color: var(--ink-3); }
  .chip { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 11px; white-space: nowrap; }
  .nc-a { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 12px; }
  .nc-a .play-link { align-self: flex-start; }
  .nc-a a { color: var(--accent-ink); text-decoration: none; font-weight: 500; padding: 4px 0; }
  .nc-a a.ext { color: var(--ink-2); }
  @media (hover: hover) and (pointer: fine) { .nc-a a:hover { text-decoration: underline; text-underline-offset: 3px; } }
  .chead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; padding-bottom: 20px; }
  .chead .kind { font-size: 13px; color: var(--ink-3); }
  .chead .obj { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-3); }

  .enter { animation: p2-in 280ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 40ms); }
  
  .swap { animation: p2-fade 180ms ease-out both; }
  
  @media (prefers-reduced-motion: reduce) {
    .enter { animation: p2-fade 200ms ease-out both; animation-delay: 0ms; }
    .seg[data-ready] .ind { transition: none; }
  }


  /* ---------- V2 Quadrant ---------- */
  .v2 .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-bottom: 20px; }
  .v2 .grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; align-items: start; }
  .v2 .chart-card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: 16px 16px 8px; min-width: 0; }
  .v2 .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .v2 .legend button { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font-size: 13px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); transition: background-color 150ms ease, color 150ms ease, box-shadow 150ms ease; }
  .v2 .legend button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .v2 .legend button:active { transform: scale(0.97); }
  .v2 .legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--sw); flex: none; }
  .v2 .legend .hollow { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: var(--ink-3); padding: 0 4px; }
  .v2 .legend .hollow b { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  .v2 .legend .hollow b.f { background: var(--ink-3); box-shadow: none; }
  .v2 .plot { position: relative; }
  .v2 svg { display: block; width: 100%; overflow: visible; touch-action: manipulation; }
  .v2 svg text { font-family: var(--font-sans); fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .v2 .dot { transition: opacity 180ms ease; }
  .v2 .tip { position: absolute; z-index: 5; pointer-events: none; min-width: 140px; max-width: 220px; padding: 8px 10px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow-2); font-size: 12px; line-height: 1.45; opacity: 0; transform: translate(-50%, calc(-100% - 12px)) scale(0.97); transform-origin: 50% 100%; transition: opacity 120ms ease-out, transform 120ms ease-out; }
  .v2 .tip[data-show] { opacity: 1; transform: translate(-50%, calc(-100% - 12px)); }
  .v2 .tip strong { display: block; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .v2 .tip .k { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
  .v2 .tip .k i { width: 10px; height: 2px; border-radius: 1px; background: var(--sw); }
  .v2 .tip .tt { color: var(--ink); margin-top: 4px; font-weight: 550; }
  .v2 .tip .ac { color: var(--ink-3); }
  .v2 .note { font-size: 12px; color: var(--ink-3); padding: 4px 4px 8px; }
  .v2 .panel { display: grid; gap: 16px; position: sticky; top: 72px; }
  .v2 .panel h2 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  .v2 .panel h2 i { width: 10px; height: 10px; border-radius: 50%; background: var(--sw); flex: none; }
  .v2 .panel p { color: var(--ink-2); font-size: 14px; }
  .v2 .panel .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .v2 .panel .trio .nc-t { font-size: 12px; }
  .v2 .panel .trio .nc-m { font-size: 11px; flex-direction: column; gap: 2px; }
  .v2 .panel .trio .nc-a { flex-direction: column; gap: 0; }
  .v2 .frow { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 14px 12px; border: 0; border-radius: var(--r-md); background: transparent; cursor: pointer; transition: background-color 150ms ease; }
  .v2 .frow:active { transform: scale(0.98); }
  @media (hover: hover) and (pointer: fine) { .v2 .frow:hover { background: var(--surface-2); } }
  .v2 .frow i { width: 10px; height: 10px; border-radius: 50%; background: var(--sw); }
  .v2 .frow b { font-weight: 600; display: block; }
  .v2 .frow small { color: var(--ink-3); font-size: 12px; }
  .v2 .frow .q { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .v2 .frow .q small { display: block; font-weight: 400; }
  @media (max-width: 960px) { .v2 .grid { grid-template-columns: minmax(0, 1fr); } .v2 .panel { position: static; } .v2 .legend .hollow { margin-left: 0; } }



}
/* ================= teardown ================= */
#teardown {

  .td { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  @media (max-width: 720px) { .td { padding: 0 16px; } }
  .td button, .td a { touch-action: manipulation; }

  .td-in { animation: td-in 260ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms); }
  
  .td-grow { transform-origin: left center; animation: td-grow 300ms var(--ease-out) both; animation-delay: calc(120ms + var(--i, 0) * 45ms); }
  
  @media (prefers-reduced-motion: reduce) {
    .td-in { animation: td-fade 200ms ease both; animation-delay: 0ms; }
    .td-grow { animation: none; }
    
  }

  /* header */
  .td-head { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .td-head > * { min-width: 0; }
  .td-head h2 { font-size: clamp(26px, 3vw + 12px, 36px); font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; }
  .td-head .desc { color: var(--ink-2); max-width: 60ch; }
  .td-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-3); font-size: 13px; }
  .td-meta b { color: var(--ink); font-weight: 600; }

  /* switcher between the researched teardowns */
  .td-switch { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface-2); width: max-content; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .td-switch button {
    flex: none; border: 0; background: transparent; cursor: pointer;
    min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; color: var(--ink-2);
    transition: color 150ms ease-out, background-color 150ms ease-out, box-shadow 150ms ease-out, transform 160ms var(--ease-out);
  }
  .td-switch button:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .td-switch button:hover { color: var(--ink); } }
  .td-switch button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
  .td-switch .c { color: var(--ink-3); margin-right: 6px; }
  .td-switch .c-short { display: none; }
  @media (max-width: 520px) {
    .td-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; overflow: visible; border-radius: 14px; }
    .td-switch button { display: grid; align-content: center; gap: 1px; min-width: 0; min-height: 48px; padding: 4px 6px; border-radius: 10px; text-align: center; }
    .td-switch .c { margin: 0; font-size: 13px; font-weight: 600; color: inherit; }
    .td-switch .c-full { display: none; }
    .td-switch .c-short { display: inline; }
    .td-switch .fn { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  }

  .td-sub { color: var(--ink-2); font-size: 14px; }
  .td-muted { color: var(--ink-3); font-size: 13px; }
  .td-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--surface-2); font-size: 12px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }

  /* bento */
  .td-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
  .td-card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
  .td-lbl { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .td-lbl h2 { font: inherit; color: inherit; }
  .hero { grid-column: span 3; grid-row: span 2; }
  .acct { grid-column: span 4; }
  .fun { grid-column: span 5; }
  .struct { grid-column: span 5; }
  .why { grid-column: span 4; }
  .traffic, .apply-wrap { grid-column: 1 / -1; }
  .hero .cap { font-size: 13px; display: grid; gap: 2px; }
  /* cover fills the 2-row tile so it never leaves dead space under it */
  @media (min-width: 721px) {
    .hero { display: flex; flex-direction: column; }
    .hero > .cover-wrap { flex: 1; display: flex; min-height: 0; }
    .hero > .cover-wrap > .cover { flex: 1; aspect-ratio: auto; min-height: 240px; }
  }
  .acct .name { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
  .kpis { display: grid; grid-template-columns: repeat(2, auto); justify-content: start; column-gap: 32px; gap: 6px; font-size: 12px; color: var(--ink-3); }
  .kpis b { display: block; color: var(--ink); font-size: 16px; font-weight: 650; }
  @media (max-width: 1080px) {
    .hero { grid-column: span 4; }
    .acct, .fun { grid-column: span 8; }
    .struct, .why { grid-column: span 6; }
  }
  @media (max-width: 720px) {
    .td-grid { grid-template-columns: 1fr; }
    .td-grid > * { grid-column: 1 / -1 !important; grid-row: auto !important; }
    .hero { grid-template-columns: 120px 1fr; align-items: start; }
    .hero .sibs-h, .hero .sibs { grid-column: 1 / -1; }
    .hero .sibs { grid-template-columns: repeat(2, 120px); }
  }

  /* hero extras */
  .hero .cap a { color: var(--ink-2); text-decoration: none; font-size: 12px; }
  @media (hover: hover) and (pointer: fine) { .hero .cap a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; } }
  .sibs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .sibs a { display: grid; gap: 4px; text-decoration: none; font-size: 12px; color: var(--ink-2); min-width: 0; }
  .sibs a span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sibs .cover { border-radius: var(--r-sm); }
  .sibs .cover-tag { font-size: 10px; }
  .sibs-h { font-size: 12px; font-weight: 600; color: var(--ink-3); }

  /* leaderboard records (定量) */
  .recs { list-style: none; margin: 0; padding: 0; display: grid; }
  .recs li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .recs li:first-child { border-top: 0; padding-top: 0; }
  .recs .m { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .recs .m span { color: var(--ink-3); }
  .recs .rk { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .recs .rk b { color: var(--ink); font-weight: 650; font-size: 15px; }
  .recs .trk { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
  .recs .trk span { display: block; height: 100%; border-radius: 2px; background: var(--s1); }
  .recs li + li .trk span { background: var(--s-muted); }
  .q-sum { font-size: 15px; font-weight: 600; line-height: 1.45; max-width: 52ch; }

  /* money chain */
  .chain { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: st; }
  .chain li { position: relative; display: grid; grid-template-columns: 22px 1fr; gap: 2px 12px; padding-bottom: 14px; counter-increment: st; }
  .chain li:last-child { padding-bottom: 0; }
  .chain li::before { content: counter(st); grid-row: span 2; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 11px; font-weight: 650; color: var(--ink-2); font-variant-numeric: tabular-nums; z-index: 1; }
  .chain li:last-child::before { background: var(--accent-soft); color: var(--accent-ink); box-shadow: none; }
  .chain li:not(:last-child)::after { content: ""; position: absolute; left: 10.5px; top: 22px; bottom: 0; width: 1px; background: var(--line-strong); }
  .chain b { font-size: 14px; font-weight: 600; }
  .chain span { font-size: 12px; color: var(--ink-3); }
  .inf { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; margin-left: 6px; border-radius: 999px; font-size: 11px; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-strong); vertical-align: 1px; }

  /* structure + why */
  .steps { list-style: none; margin: 0; padding: 0; display: grid; }
  .steps li { display: grid; grid-template-columns: 5.5em 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .steps li:first-child { border-top: 0; }
  .steps .t { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
  .whys { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: why; }
  .whys li { counter-increment: why; display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 14px; }
  .whys li::before { content: counter(why); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); font-size: 12px; font-weight: 650; }

  /* ---------- 流量从哪来 ---------- */
  .traffic { padding: 0; gap: 0; }
  .traffic > .td-lbl { padding: 16px 18px 0; }
  .traffic .layers { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
  .traffic .layers.qual-only { grid-template-columns: minmax(0, 1fr); }
  .layer { display: grid; gap: 14px; align-content: start; padding: 16px 18px 20px; min-width: 0; }
  .layer + .layer { border-left: 1px solid var(--line); }
  .layer-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .layer-h b { font-size: 14px; font-weight: 600; color: var(--ink); }
  .layer-h span { font-size: 12px; color: var(--ink-3); }
  .foot { display: grid; gap: 2px; font-size: 12px; color: var(--ink-3); }
  .foot b { color: var(--ink-2); font-weight: 600; }
  .nodata { margin: 14px 18px 0; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); font-size: 13px; color: var(--ink-2); }

  .verdict { display: grid; gap: 4px; }
  .verdict strong { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
  .verdict p { font-size: 14px; color: var(--ink-2); max-width: 65ch; }

  .kw { width: 100%; border-collapse: collapse; font-size: 13px; }
  .kw th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 0 12px 8px 0; white-space: nowrap; }
  .kw td { padding: 10px 12px 10px 0; border-top: 1px solid var(--line); vertical-align: middle; }
  .kw th:last-child, .kw td:last-child { padding-right: 0; }
  .kw .w { font-weight: 600; white-space: nowrap; }
  .kw .note { color: var(--ink-2); }
  .where { display: inline-flex; gap: 3px; }
  .where span { display: inline-grid; place-items: center; height: 20px; padding: 0 6px; border-radius: 5px; font-size: 11px; white-space: nowrap; }
  .where .on { background: color-mix(in oklch, var(--s1) 14%, transparent); color: var(--ink); font-weight: 600; }
  .where .off { color: var(--ink-3); opacity: 0.55; box-shadow: inset 0 0 0 1px var(--line); }

  .lt { display: grid; gap: 8px; }
  .lt-h { font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .lt ul { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .lt li { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px 0 9px; border-radius: 999px; font-size: 13px; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .lt svg { width: 13px; height: 13px; flex: none; color: var(--ink-3); }

  @media (max-width: 960px) {
    .traffic .layers { grid-template-columns: minmax(0, 1fr); }
    .layer + .layer { border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (max-width: 720px) {
    .kw thead { display: none; }
    .kw, .kw tbody, .kw tr, .kw td { display: block; }
    .kw tr { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; padding: 12px 0; border-top: 1px solid var(--line); }
    .kw td { padding: 0; border: 0; }
    .kw .where-td { grid-column: 1 / -1; grid-row: 2; }
    .kw .note { grid-column: 1 / -1; }
    .kw .role { justify-self: end; }
  }

  /* apply */
  .apply {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 16px; border-radius: var(--r-md); background: var(--accent-soft); text-decoration: none; font-size: 14px;
    transition: transform 160ms var(--ease-out);
  }
  .apply:active { transform: scale(0.98); }
  .apply .lbl { font-weight: 650; color: var(--accent-ink); }
  .apply .go { margin-left: auto; color: var(--accent-ink); font-weight: 600; white-space: nowrap; }

  /* empty state */
  .empty { display: grid; grid-template-columns: 220px 1fr; gap: 32px; align-items: start; margin-top: 32px; }
  .empty .msg { display: grid; gap: 14px; padding-top: 8px; }
  .empty h2 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  .empty .stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 4px 28px; margin: 6px 0; }
  .empty .stats span { color: var(--ink-3); font-size: 13px; }
  .empty .stats b { display: block; font-size: 20px; font-weight: 650; color: var(--ink); }
  .empty .done { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .empty .done a { display: flex; gap: 10px; align-items: center; min-height: 44px; padding: 0 14px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-1); text-decoration: none; font-size: 14px; transition: box-shadow 150ms ease-out, transform 160ms var(--ease-out); }
  .empty .done a:active { transform: scale(0.98); }
  @media (hover: hover) and (pointer: fine) { .empty .done a:hover { box-shadow: var(--shadow-2); } }
  .empty .done a span { color: var(--ink-3); }
  @media (max-width: 720px) {
    .empty { grid-template-columns: 1fr; gap: 20px; }
    .empty .cover-wrap { max-width: 200px; }
    .empty .stats { grid-template-columns: repeat(2, auto); }
  }

}
/* ================= playbook ================= */
#playbook {


  /* ---------- page frame ---------- */
  .p4 { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  .p4-head { display: grid; gap: 10px; margin-bottom: 40px; }
  .p4-head h2 { font-size: clamp(26px, 3vw, 34px); font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; }
  .p4-head p { color: var(--ink-2); max-width: 65ch; }
  .p4-head p b { color: var(--ink); font-weight: 600; }

  .seg button, .v2-row a { touch-action: manipulation; }
  .tbc { display: inline-flex; align-items: center; margin-right: 6px; padding: 1px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-strong); vertical-align: 1px; }

  /* law identity dot — always paired with the law label, never color alone */
  .lawdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--lc); flex: none; }
  [data-law="L1"] { --lc: var(--s1); }
  [data-law="L2"] { --lc: var(--s2); }
  [data-law="L3"] { --lc: var(--s3); }

  /* evidence: two direct-labeled bars on one 0–100% scale */
  .ev { display: grid; gap: 10px; width: 300px; max-width: 100%; margin: 0; }
  .ev-cap { font-size: 12px; color: var(--ink-3); }
  .ev-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; font-size: 13px; color: var(--ink-2); }
  .ev-row b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; font-size: 15px; }
  .ev-row .n { font-variant-numeric: tabular-nums; color: var(--ink-3); }
  .ev-track { grid-column: 1 / -1; position: relative; height: 6px; border-radius: 999px; background: var(--s-muted); overflow: hidden; }
  .ev-fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--ink); }
  .ev-row.is-muted .ev-fill { background: var(--ink-3); }
  .ev-dots { display: flex; flex-wrap: wrap; gap: 3px; grid-column: 1 / -1; }
  .ev-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }

  /* product mock badge */
  .mock { position: relative; }
  .mock .cover { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
  .mock-badge {
    display: inline-flex; align-items: center; gap: 6px; width: fit-content;
    font-size: 11px; font-weight: 600; color: var(--accent-ink);
    padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); white-space: nowrap;
  }

  .kv { display: grid; grid-template-columns: 3.5em 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
  .kv dt { color: var(--ink-3); }
  .kv dd { margin: 0; color: var(--ink); }
  .kpi { margin-top: 16px; font-size: 13px; color: var(--ink-2); }
  .kpi b { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); margin-bottom: 2px; }

  /* entrance: transform + opacity only, staggered */
  .rise { animation: rise 280ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 50ms); }
  
  @media (prefers-reduced-motion: reduce) {
    .rise { animation-name: fade; }
    
  }

  /* ---------- 映射 ---------- */
  .seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); margin-bottom: 28px; max-width: 100%; }
  .seg-hl { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-1); transition: transform 220ms var(--ease-out); }
  .seg button { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 18px; border: 0; background: none; border-radius: 999px; cursor: pointer; color: var(--ink-3); font-size: 14px; white-space: nowrap; transition: color 150ms ease; }
  .seg button[aria-selected="true"] { color: var(--ink); }
  @media (hover: hover) and (pointer: fine) { .seg button:hover { color: var(--ink); } }
  .seg button:active { transform: scale(0.97); }
  @media (max-width: 560px) { .seg { display: grid; width: 100%; } .seg button { height: auto; min-height: 44px; padding: 6px 8px; font-size: 12px; line-height: 1.3; white-space: normal; text-align: left; } }
  .v2-panel { display: grid; gap: 24px; }
  .v2-panel.swap { animation: swap 180ms var(--ease-out); }
  
  @media (prefers-reduced-motion: reduce) { .v2-panel.swap { animation-name: fade; } .seg-hl { transition: none; } }
  .v2-claim { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; }
  .v2-claim h2 { font-size: clamp(20px, 2.4vw, 26px); font-weight: 650; letter-spacing: -0.015em; line-height: 1.35; max-width: 32ch; }
  .v2-panes { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-radius: var(--r-lg); box-shadow: var(--shadow-1); background: var(--surface); overflow: hidden; }
  .v2-pane { padding: 28px; display: grid; gap: 16px; align-content: start; min-width: 0; }
  .v2-pane + .v2-pane { border-left: 1px solid var(--line); background: color-mix(in oklch, var(--accent-soft) 35%, var(--surface)); }
  .v2-pane h3 { font-size: 13px; font-weight: 600; color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .v2-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 8px; margin: -8px; border-radius: var(--r-md); transition: background-color 150ms ease; }
  @media (hover: hover) and (pointer: fine) { .v2-row:hover { background: var(--surface-2); } }
  .v2-row a { text-decoration: none; }
  .v2-row-cov { display: block; border-radius: 8px; transition: transform 160ms var(--ease-out); }
  .v2-row-cov:active { transform: scale(0.97); }
  .v2-row .cover { border-radius: 8px; }
  .v2-row-l { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 4px; font-size: 12px; }
  .v2-row-l a { color: var(--ink-2); padding: 2px 0; transition: color 150ms ease; }
  @media (hover: hover) and (pointer: fine) { .v2-row-l a:hover { color: var(--ink); } .v2-row-t:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong); } }
  .v2-row .cover-text { font-size: 9px; left: 8%; right: 8%; }
  .v2-row .cover-play { width: 14px; height: 14px; font-size: 6px; right: 4px; top: 4px; }
  .v2-row-t { font-size: 14px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .v2-row-m { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .v2-row-n { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .v2-row-n small { display: block; font-size: 11px; color: var(--ink-3); }
  .v2-me { display: grid; grid-template-columns: 150px 1fr; gap: 20px; }
  .v2-me h4 { font-size: 17px; font-weight: 650; margin-bottom: 4px; }
  .v2-me .sub { font-size: 13px; color: var(--ink-2); }
  .steps-list { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; counter-reset: s; }
  .steps-list li { counter-increment: s; display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; }
  .steps-list li::before { content: counter(s); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-2); margin-top: 1px; }
  @media (max-width: 860px) {
    .v2-panes { grid-template-columns: 1fr; }
    .v2-pane + .v2-pane { border-left: 0; border-top: 1px solid var(--line); }
    .v2-claim { grid-template-columns: 1fr; gap: 14px; }
  }
  @media (max-width: 560px) { .v2-pane { padding: 20px; } .v2-me { grid-template-columns: 110px 1fr; gap: 14px; } }

  @media (max-width: 560px) { .p4 { padding: 0 16px; } .p4-head { margin-bottom: 28px; } }

}
</style>

<body>
<main class="brief">
  <section id="product" aria-label="我的产品"><div id="product-root"></div></section>
  <section id="competitors" aria-label="锁定竞品"><div id="competitors-root"></div></section>

document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-go]');
  if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

<script>/* ---- 我的产品 ---- */
(function () {

  const toc = [

    </dl>
    <div class="cv-goal"><span><b>本轮目标</b>　${p.goal}</span><span class="cv-sp">${p.sellingPoints.map((s) => `<span>${s}</span>`).join('')}</span></div>
    <ol class="cv-steps">${toc.map((s) => `<li><a href="#${s.id}"><span class="t">${s.t}</span><span class="d">${s.d}</span><span class="go">往下看 ↓</span></a></li>`).join('')}</ol>
